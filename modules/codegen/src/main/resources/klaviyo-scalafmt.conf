# scalafmt configuration bundled inside klaviyo4s-codegen.
#
# The codegen extracts this file to a temp path at runtime and hands it
# to scalafmt-dynamic together with each emitted .scala file. It does NOT
# participate in `sbt scalafmtAll` — that uses the project's own
# `.scalafmt.conf`.
#
# Important: this file deliberately omits the `project { includePaths /
# excludePaths }` block. scalafmt-dynamic evaluates those globs against
# the file path passed to `format(...)`, and the codegen writes its
# output under the calling build's `target/.../src_managed/...` —
# matching any `**/target/**` exclude would cause every file to be
# silently skipped and left unformatted.
#
# Key requirement (from the project brief): NO significant indentation.
# Scala 3 dialect is enabled because we use Scala 3 syntax (`enum`,
# `extension`, `given`, `using`, opaque types) but classical braces must
# remain everywhere. scalafmt only removes braces when explicitly asked,
# so we just refrain from enabling the relevant `RedundantBraces` /
# `Scala3.removeOptionalBraces` rewrites.

version = "3.11.1"

runner.dialect = scala3

maxColumn = 120
align.preset = none
align.openParenCallSite = false
align.openParenDefnSite = false

continuationIndent {
  callSite = 2
  defnSite = 2
}

newlines {
  source = keep
  topLevelStatementBlankLines = [
    { blanks { before = 1 } }
  ]
}

rewrite {
  rules = [SortImports, RedundantParens]
  # Deliberately NOT enabling `Scala3.removeOptionalBraces` so that braces
  # are preserved everywhere (no significant indentation).
}

docstrings {
  style = SpaceAsterisk
  wrap = no
}
